spring.application.name=backend-usuario

# Lee el .env de esta carpeta (formato CLAVE=valor). Si no existe, usa variables de entorno del sistema.
spring.config.import=optional:file:.env[.properties]

server.port=8080
server.servlet.context-path=/api

# Supabase (PostgreSQL). Si usas el pooler en modo transaccion (puerto 6543) agrega &prepareThreshold=0
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=${DB_SSLMODE:require}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# La BD ya existe: nadie crea ni modifica tablas desde la API
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT (24 h)
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# Supabase Storage (H4). Si faltan las variables la API arranca igual, pero la carga de licencias responde 503.
supabase.url=${SUPABASE_URL:}
supabase.secret-key=${SUPABASE_SECRET_KEY:}
supabase.bucket-licencias=${SUPABASE_BUCKET_LICENCIAS:licencias}

# Subida de archivos: maximo 5 MB por archivo
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB


# Correo (H12, H17, H20). Si MAIL_HOST esta vacio la API arranca igual, pero no envia correos.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.from=${MAIL_FROM:no-reply@boticompara.local}

# Alerta diaria de stock bajo (H12): todos los dias a las 8:00, hora de Lima. Para probar, cambiar ALERTA_STOCK_CRON en el .env
app.alertas.stock.habilitada=${ALERTA_STOCK_HABILITADA:true}
app.alertas.stock.cron=${ALERTA_STOCK_CRON:0 0 8 * * *}


# URL publica del backend, usada en los enlaces de los correos (H20). En produccion cambiarla con APP_BASE_URL.
app.base-url=${APP_BASE_URL:http://localhost:8080/api}