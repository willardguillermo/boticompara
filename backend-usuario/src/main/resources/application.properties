spring.application.name=backend-usuario

# Lee el .env de esta carpeta (formato CLAVE=valor). Si no existe, usa variables de entorno del sistema.
spring.config.import=optional:file:.env[.properties]

server.port=8080
server.servlet.context-path=/api

# Supabase (PostgreSQL). Si usas el pooler en modo transacción (puerto 6543) agrega &prepareThreshold=0
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=${DB_SSLMODE:require}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# La BD ya existe: nadie crea ni modifica tablas desde la API
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT (24 h)
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000
